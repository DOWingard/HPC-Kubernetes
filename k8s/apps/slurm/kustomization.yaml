apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hpc
resources:
  - namespace.yaml
  - mariadb.yaml
  - slurmdbd.yaml
  - slurmctld.yaml
  - accounting-bootstrap.yaml
generatorOptions:
  # The power-save hook creates burst pods that reference these by fixed name.
  disableNameSuffixHash: true
configMapGenerator:
  - name: slurm-config
    files:
      - config/slurm.conf
      - config/cgroup.conf
  - name: slurm-burst
    files:
      - config/cgroup-burst.conf
      - config/burst-pod.json
  - name: slurmdbd-template
    files:
      - config/slurmdbd.conf.tmpl
