# Single source of truth for the hpclab cluster. The controller and burst pods
# mount it from a ConfigMap; the bare-metal node fetches it from slurmctld
# (configless mode), so every daemon always sees the same file.
ClusterName=hpclab

# "slurmctld" resolves to the headless Service inside Kubernetes and to the
# k3d node (hostPort 6817) from the bare-metal container.
SlurmctldHost=slurmctld-0(slurmctld)
SlurmctldPort=6817
SlurmdPort=6818
SlurmctldParameters=enable_configless,idle_on_node_suspend
# Nodes span two networks (Docker bridge and the pod CIDR) that cannot reach
# each other directly, so slurmctld must contact every node itself instead of
# fanning messages out through other slurmds.
TreeWidth=65533

AuthType=auth/munge
CredType=cred/munge
SlurmUser=slurm
SlurmdUser=root
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid
SlurmctldDebug=info
SlurmdDebug=info
ReturnToService=2
MpiDefault=none
MailProg=/bin/true

# Resource isolation: every job step lives in its own cgroup v2 subtree with
# CPU and memory limits matching its allocation.
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=15
# Containers report the host's CPU/RAM; trust the declared node sizes instead.
SlurmdParameters=config_overrides

SchedulerType=sched/backfill
# Reject at submit time jobs no partition could ever run (e.g. more CPUs than
# any node has) instead of letting them pend forever.
EnforcePartLimits=ALL
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
PriorityType=priority/multifactor
PriorityWeightFairshare=10000
PriorityWeightAge=1000

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
AccountingStorageEnforce=associations,limits,qos
AccountingStorageTRES=cpu,mem,node
JobCompType=jobcomp/none
# Tenants only see their own jobs and usage; root and SlurmUser see everything.
PrivateData=jobs,usage

# Cloud bursting: burst-* nodes start powered down (State=CLOUD). When work is
# queued for them slurmctld runs ResumeProgram, which creates one pod per node
# and reports each pod IP back as the node's NodeAddr; after SuspendTime
# seconds idle, SuspendProgram deletes the pods again.
ResumeProgram=/opt/hpc/bin/k8s-resume
SuspendProgram=/opt/hpc/bin/k8s-suspend
ResumeFailProgram=/opt/hpc/bin/k8s-resume-fail
ResumeTimeout=180
SuspendTimeout=45
SuspendTime=90
ResumeRate=0
SuspendRate=0
SuspendExcParts=local-node

NodeName=bm-node-01 NodeAddr=172.28.0.200 CPUs=4 RealMemory=1800 State=UNKNOWN
NodeName=burst-[0-3] CPUs=2 RealMemory=900 State=CLOUD Feature=k8s

PartitionName=local-node Nodes=bm-node-01 Default=YES MaxTime=60 DefMemPerCPU=256 State=UP
PartitionName=k8s-burst Nodes=burst-[0-3] MaxTime=60 DefMemPerCPU=256 State=UP
