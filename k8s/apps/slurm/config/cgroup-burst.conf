# Burst pods have no systemd, so slurmd builds its cgroup v2 hierarchy directly
# under the pod's container cgroup.
CgroupPlugin=cgroup/v2
IgnoreSystemd=yes
EnableControllers=yes
# Core pinning is off here: every pod sees the host's full CPU list, so Slurm
# would pin every burst job to the same physical cores (0..N-1) and they would
# contend while other cores sit idle. CPU isolation comes from the pod's
# Kubernetes CPU limit (CFS quota) instead, which equals the node's Slurm CPUs.
ConstrainCores=no
ConstrainRAMSpace=yes
ConstrainSwapSpace=yes
AllowedSwapSpace=0
