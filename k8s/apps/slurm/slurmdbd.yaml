apiVersion: v1
kind: Service
metadata:
  name: slurmdbd
  labels: {app.kubernetes.io/name: slurmdbd, app.kubernetes.io/part-of: hpclab}
spec:
  clusterIP: None
  # Slurm daemons and clients resolve each other by this name, including
  # the readiness probe itself, so the address must exist before readiness.
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: slurmdbd}
  ports:
    - {name: slurmdbd, port: 6819}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slurmdbd
  labels: {app.kubernetes.io/name: slurmdbd, app.kubernetes.io/part-of: hpclab}
spec:
  serviceName: slurmdbd
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: slurmdbd}
  template:
    metadata:
      labels: {app.kubernetes.io/name: slurmdbd, app.kubernetes.io/part-of: hpclab}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      initContainers:
        - name: munge
          image: hpclab/slurm:0.1.0
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: [/opt/hpc/bin/munge-entrypoint]
          startupProbe:
            exec: {command: [sh, -c, "munge -n | unmunge >/dev/null"]}
            periodSeconds: 1
            failureThreshold: 30
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: munge-key, mountPath: /etc/munge-secret, readOnly: true}
            - {name: munge-run, mountPath: /run/munge}
      containers:
        - name: slurmdbd
          image: hpclab/slurm:0.1.0
          imagePullPolicy: IfNotPresent
          command: [/opt/hpc/bin/slurmdbd-entrypoint]
          env:
            - {name: STORAGE_HOST, value: mariadb}
            - name: SLURMDBD_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: slurm-db, key: slurmdbd-password}}
          ports:
            - {name: slurmdbd, containerPort: 6819}
          readinessProbe:
            tcpSocket: {port: 6819}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: munge-run, mountPath: /run/munge}
            - {name: template, mountPath: /etc/slurm-templates, readOnly: true}
            - {name: etc-slurm, mountPath: /etc/slurm}
      volumes:
        - name: munge-key
          secret: {secretName: munge-key, defaultMode: 0400}
        - name: munge-run
          emptyDir: {}
        - name: template
          configMap: {name: slurmdbd-template}
        - name: etc-slurm
          emptyDir: {}
