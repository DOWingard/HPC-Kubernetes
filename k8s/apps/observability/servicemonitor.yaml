apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: slurm-exporter
  namespace: hpc
  labels: {app.kubernetes.io/name: slurm-exporter, app.kubernetes.io/part-of: hpclab}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: slurm-exporter}
  endpoints:
    - port: metrics
      interval: 15s
      honorLabels: true
