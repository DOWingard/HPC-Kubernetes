apiVersion: v1
kind: Service
metadata:
  name: portal
  labels: {app.kubernetes.io/name: portal, app.kubernetes.io/part-of: hpclab}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: portal}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels: {app.kubernetes.io/name: portal, app.kubernetes.io/part-of: hpclab}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: portal}
  template:
    metadata:
      labels: {app.kubernetes.io/name: portal, app.kubernetes.io/part-of: hpclab}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      initContainers:
        - name: munge
          image: hpclab/slurm:0.1.0
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: [/opt/hpc/bin/munge-entrypoint]
          startupProbe:
            exec: {command: [sh, -c, "munge -n | unmunge >/dev/null"]}
            periodSeconds: 1
            failureThreshold: 30
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: munge-key, mountPath: /etc/munge-secret, readOnly: true}
            - {name: munge-run, mountPath: /run/munge}
      containers:
        - name: api
          image: hpclab/portal:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORTAL_API_TOKENS
              valueFrom: {secretKeyRef: {name: portal-tokens, key: tokens}}
            - {name: ALLOWED_PARTITIONS, value: "local-node,k8s-burst"}
            - {name: LOG_LEVEL, value: info}
          ports:
            - {name: http, containerPort: 8000}
          # Root is required only so runuser can switch to the tenant's UID;
          # every other capability is dropped.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [SETUID, SETGID, AUDIT_WRITE]
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: munge-run, mountPath: /run/munge}
            - {name: slurm-config, mountPath: /etc/slurm, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: munge-key
          secret: {secretName: munge-key, defaultMode: 0400}
        - name: munge-run
          emptyDir: {}
        - name: slurm-config
          configMap: {name: slurm-config}
        - name: tmp
          emptyDir: {}
