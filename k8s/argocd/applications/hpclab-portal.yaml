apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hpclab-portal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    # ${GITOPS_REPO_URL} and ${GITOPS_REVISION} are substituted by scripts/up.sh from .env.
    repoURL: ${GITOPS_REPO_URL}
    targetRevision: ${GITOPS_REVISION}
    path: k8s/apps/portal
  destination:
    server: https://kubernetes.default.svc
    namespace: hpc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: ["CreateNamespace=true"]
